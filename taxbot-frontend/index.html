<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/gra-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TaxBot — Official Ghana Revenue Authority AI Tax Assistant. Get instant answers about taxes in Ghana."
    />
    <title>TaxBot | Ghana Revenue Authority Tax Assistant</title>
    <!-- Geist font from Vercel CDN -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.1.1/latin.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5.1.1/latin.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <!-- Loading skeleton shown while React initializes -->
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:Geist,system-ui,sans-serif;background:linear-gradient(160deg,#12171F 0%,#1A2030 50%,#212A3A 100%);color:#E2E8F0">
        <div style="width:3rem;height:3rem;border-radius:0.75rem;background:linear-gradient(135deg,#C4922A,#D4A84A);display:flex;align-items:center;justify-content:center;margin-bottom:1rem;box-shadow:0 4px 20px rgba(196,146,42,0.15)">
          <span style="font-size:10px;font-weight:700;color:#fff">GRA</span>
        </div>
        <div style="height:4px;width:120px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden">
          <div style="height:100%;width:40%;background:linear-gradient(90deg,#C4922A,#D4A84A);border-radius:2px;animation:loading 1.2s ease-in-out infinite"></div>
        </div>
      </div>
      <style>@keyframes loading{0%{transform:translateX(-100%)}50%{transform:translateX(200%)}100%{transform:translateX(-100%)}}</style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
