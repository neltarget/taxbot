services:
  - type: web
    name: taxbot
    runtime: python
    plan: free
    buildCommand: >
      pip install uv &&
      uv sync --no-dev
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT --log-level info
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: VITE_API_URL
        value: ""
      - key: PYTHON_VERSION
        value: 3.12.0
